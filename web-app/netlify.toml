[build]
  command = "pnpm run build"
  publish = "dist"

[[plugins]]
  package = "@netlify/plugin-lighthouse"

# Enable Netlify Forms
[build.environment]
  NODE_VERSION = "20"

# Language-based redirects (server-side, SEO-friendly)
# Redirect root to French for users with French browser
[[redirects]]
  from = "/"
  to = "/fr/"
  status = 302
  conditions = {Language = ["fr"]}

# Redirect root to English for users with English browser
[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  conditions = {Language = ["en"]}

# Default redirect to French (Quebec-based business)
[[redirects]]
  from = "/"
  to = "/fr/"
  status = 302

# Trailing-slash enforcement for language roots
[[redirects]]
  from = "/en"
  to = "/en/"
  status = 301
  force = true

[[redirects]]
  from = "/fr"
  to = "/fr/"
  status = 301
  force = true

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache HTML pages for shorter time (for language updates)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/fr/*"
  [headers.values]
    Content-Language = "fr"

[[headers]]
  for = "/en/*"
  [headers.values]
    Content-Language = "en"
